
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <title>Pokemon World - Room</title>
</head>
<body>
    <main class="container">
        <div class="screen-label">Screen 3 - Room</div>
        <h1 id="roomName">Viridian Forest</h1>
        <div class="room-scene forest" id="roomScene">
            <img
            src="./images/rooms/ViridianForest.png"
            alt="Viridian Forest"
            class="hero-image"
            id="roomImage"
            >
            <img src="./images/spots/grass.png" alt="Grass 1" class="hiding-spot hiding-spot1">
            <img src="./images/spots/grass.png" alt="Grass 2" class="hiding-spot hiding-spot2">
            <img src="./images/spots/grass.png" alt="Grass 3" class="hiding-spot hiding-spot3">
        </div>
        <div class="info-box">
            <p id="message">Something is moving. Search to find Pokemon!</p>
        </div>
        <div >
            <button type="button" class="primary-button" id="moveButton">
                Move
            </button>
            <button type="button" class="primary-button" id="progressButton">
                Your progress
            </button>
            <button type="button" class="primary-button" id="saveButton">
                Save
            </button>
            <button type="button" class="primary-button" id="quitButton">
                Quit
            </button>
        </div>
    </main>
</body>
</html>
