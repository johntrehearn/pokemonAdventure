
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <title>Pokemon World - Room</title>
</head>
<body>
    <main class="container">
        <div class="screen-label">Screen 3 - Room</div>
        <h1>Viridian Forest</h1>
        <img
            src="./images/rooms/viridianForest.png"
            alt="Viridian Forest"
            class="hero-image"
        >
        <div class="info-box">
            Something is hidden in this room!
            <br>
            Explore the room to find hidden balls.
        </div>
        <div >
            <button type="button" class="primary-button">
                Collect balls
            </button>
            <button type="button" class="primary-button">
               Catch
            </button>
            <button type="button" class="primary-button">
                Move
            </button>
            <button type="button" class="primary-button">
                Pokedex
            </button>
            <button type="button" class="primary-button">
                Inventory
            </button>
        </div>
    </main>
</body>
</html>
