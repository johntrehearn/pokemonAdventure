<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Pokemon Town</title>
  </head>

  <body>
    <div class="container">
      <h1>You are in Pallet Town</h1>
      <div class="pokeDisplay">
        <div class="card">
          <p>#1</p>
          <img src="images/menu/AlteringCave.png" alt="Altering Cave" />
          <h3 class="cardTitle">Altering Cave</h3>
          <div>
            <p>A mysterious cave near the sea.</p>
          </div>
        </div>

        <div class="card">
          <p>#2</p>
          <img src="images/menu/PalletTown.png" alt="Pallet Town" />
          <h3 class="cardTitle">Pallet Town</h3>
          <div>
            <p>A small town with a big adventure ahead.</p>
          </div>
        </div>

        <div class="card">
          <p>#3</p>
          <img src="images/menu/ViridianForest.png" alt="Viridian Forest" />
          <h3 class="cardTitle">Viridian Forest</h3>
          <div>
            <p>A deep forest filled with wild Pokemon.</p>
          </div>
        </div>
      </div>
      <div class="generation_box">
        <button class="btn" id="1">Pokedex</button>
        <button class="btn" id="2">Inventory</button>
        <button class="btn" id="3">Save</button>
        <button class="btn" id="5">Quit</button>
      </div>

  
      </div>
    </div>
  </body>
</html>
