
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Pokemon World - Start</title>
</head>
<body>
    <main class="container start-page">
        <div class="screen-label">Screen 1 - Start</div>
        <h1>POKEMON WORLD</h1>
        <p class="subtitle">
            A trainer's journey - SDG 15 Life on Land
        </p>
        <div class="info-box">
            Explore new places, collect Poke Balls and catch wild Pokemon.
            Be gentle: protect wildlife and forests.
        </div>

        <form id="startForm" class="info-box">
            <div class="form-row">
                <div class="name">
                    <label for="trainerName">Trainer name</label>
                    <input
                        type="text"
                        id="trainerName"
                        name="trainerName"
                        placeholder="Your name"
                        maxlength="30"
                        required
                    >
                </div>
                <div class="age">
                    <label for="age">Age</label>
                    <input
                        type="number"
                        id="age"
                        name="age"
                        placeholder="Age"
                        min="12"
                        max="120"
                        required
                    >
                </div>
            </div>
            <button type="submit" class="primary-button" id="start-button">
                Start journey
            </button>
            <p id="message" role="alert"></p>
        </form>
    </main>

</body>
</html>
