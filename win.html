<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <title>Pokemon World - You Win!</title>
</head>
<body>
    <main class="container">
        <div class="screen-label">Screen 7 - Win</div>
        <h1>You win! 🏆</h1>
        <p id="winMessage">Congratulations! You caught 6 Pokemon.</p>
        <h2>Your team</h2>
        <section class="pokemon-grid" id="team">
            <div>
                <img class="round" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" alt="Pikachu">
                <p>Pikachu</p>
            </div>
            <div>
                <img class="round" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/133.png" alt="Eevee">
                <p>Eevee</p>
            </div>
            <div>
                <img class="round" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/143.png" alt="Snorlax">
                <p>Snorlax</p>
            </div>
            <div>
                <img class="round" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/150.png" alt="Mewtwo">
                <p>Mewtwo</p>
            </div>
            <div>
                <img class="round" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1.png" alt="Bulbasaur">
                <p>Bulbasaur</p>
            </div>
            <div>
                <img class="round" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/4.png" alt="Charmander">
                <p>Charmander</p>
            </div>
        </section>
        <div class="info-box" id="sdgNote">
            <p>🌳 Every Pokemon was caught gently and stays safe in the wild. Thank you for protecting Life on Land!</p>
        </div>
        <div>
            <button type="button" class="primary-button" id="playAgain">Play again</button>
        </div>
    </main>
</body>
</html>
