<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Pokemon Town</title>
  </head>

  <body>
    <div class="container">
      <h1>Choose a ball</h1>
      <div class="pokeDisplay">
        <div class="card">
          <p>#1</p>
          <img src="images/balls/PokeBall.png" alt="Poke Ball" />
          <h3 class="cardTitle">Poke Ball</h3>
          <div>
            <p>Chance 40%</p>
            <p>You have it</p>
             <button class="btn" id="1">Use it</button>
          </div>
        </div>

        <div class="card">
          <p>#1</p>
          <img src="images/balls/GreatBall.png" alt="Great Ball" />
          <h3 class="cardTitle">Great Ball</h3>
          <div>
            <p>Chance 40%</p>
            <p>You have it</p>
             <button class="btn" id="1">Use it</button>
          </div>
        </div>

        <div class="card">
          <p>#1</p>
          <img src="images/balls/UltraBall.png" alt="Ultra Ball" />
          <h3 class="cardTitle">Ultra Ball</h3>
          <div>
            <p>Chance 40%</p>
            <p>You have it</p>
             <button class="btn" id="1">Use it</button>
          </div>
        </div>
      </div>

      <div>
        <button class="btn" id="2">Back to Room</button>
  
      </div>

  
      </div>
    </div>
  </body>
</html>
