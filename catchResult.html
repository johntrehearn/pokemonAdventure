<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Catch Result</title>
  </head>

  <body>
    <div class="container">
      <h1>Catch Result</h1>
      <div class="pokeDisplay">
        <div class="card">
          <p>Got Away</p>
          <img src="images/catchResult/gotAway.png" alt="Escaped" />
          <h3 class="cardTitle">Oh no they escaped</h3>
          <div>
            <p>Keep your eye out for this one in the future</p>
          </div>
        </div>

        <div class="card">
          <p>Caught It</p>
          <img src="images/catchResult/caught.png" alt="Caught It" />
          <h3 class="cardTitle">Caught it. Well Done.</h3>
          <div>
            <p>Added to inventory. Keep going for more</p>
          </div>
        </div>

        <div class="card">
          <p>Already Have</p>
          <img src="images/menu/ViridianForest.png" alt="Viridian Forest" />
          <h3 class="cardTitle">Seems you already have this one</h3>
          <div>
            <p>Keep going for more</p>
          </div>
        </div>
      </div>
      <div class="generation_box">
        <button class="btn" id="1">Try Again</button>
        <button class="btn" id="2">Back</button>
        <button class="btn" id="3">Save</button>
        <button class="btn" id="5">Quit</button>
      </div>

  
      </div>
    </div>
  </body>
</html>
