<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon World - You Win!</title>
    <link rel="stylesheet" href="css/finalPage.css">
</head>
<body>
    <main>
        <div class="screen-label">Screen 7 - Win</div>
        <h1>You win!</h1>
        <section class="win-ways">
            <div class="win-condition winner">
                <p>
                    <strong>Way 1 - Legend Hunter:</strong>
                    catch Mewtwo and collect all 3 balls.
                </p>
            </div>
            <div class="win-condition">
                <p>
                    <strong>Way 2 - Master Pokedex:</strong>
                    catch all 4 Pokemon.
                </p>
            </div>
            <div class="win-condition">
                <p>
                    <strong>Way 3 - Explorer:</strong>
                    reach the Pokemon League with at least
                    2 balls and 2 Pokemon.
                </p>
            </div>
        </section>
        <!-- Move used -->
        <div class="moves-used">
            Moves used: <span id="movesCount">[n]</span>
        </div>
        <!-- Navigations buttons -->
        <div class="win-buttons">
            <button type="button" class="play-again">
                <a href="index.html">
                    <span class="number">1</span>
                    Play again
                </a>
                
            </button>
            <button type="button" class="see-pokedex">
                <span class="number">2</span>
                See my Pokedex
            </button>
        </div>
    </main>
</body>
</html>
