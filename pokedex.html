
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <title>Pokemon World - Pokedex</title>
</head>
<body>
    <main class="container">
        <div class="screen-label">Screen 6 - Pokedex</div>
        <h1>Pokedex</h1>
        <section class="pokemon-grid">
            <div class="card">
                <h2>#1</h2>
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/133.png" alt="Eevee">
                <h3>Eevee</h3>
            </div>
            <div class="card">
                <h2>#2</h2>
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/890.png" alt="Eternatus">
                <h3>Eternatus</h3>
            </div>
            <div class="card">
                <h2>#3</h2>
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/150.png" alt="Mewtwo">
                <h3>Mewtwo</h3>
            </div>
            <div class="card">
                <h2>#4</h2>
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/108.png" alt="Lickitung">
                <h3>Lickitung</h3>
            </div>
        </section>
        <div class="button-row">
            <button class="primary-button">Back to map</button>
            <button class="primary-button">Back to room</button>
        </div>

    </main>
</body>
</html>
