<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <title>Pokemon World - Progress</title>
</head>
<body>
    <main class="container">
        <div class="screen-label">Screen 8 - Progress</div>
        <h1>Your Progress</h1>
        <div class="info-box" id="progressBox">
            <p>Caught <span id="caughtCount">3</span> / 6</p>
            <div class="bar">
                <div id="progressFill" id="progressFill" style="width: 50%; height: 100%;"></div>
            </div>
            <p id="progressHint">Catch 3 more Pokemon to win!</p>
        </div>
        <section class="pokemon-grid grid-3" id="pokemonGrid">
            <div class="card">
                <h2>#1</h2>
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" alt="Pikachu">
                <h3>Pikachu</h3>
            </div>
            <div class="card">
                <h2>#2</h2>
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/133.png" alt="Eevee">
                <h3>Eevee</h3>
            </div>
            <div class="card">
                <h2>#3</h2>
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/150.png" alt="Mewtwo">
                <h3>Mewtwo</h3>
            </div>
            <div class="card locked">
                <h2>#4</h2>
                <img src="./images/unknown.svg" alt="Not caught yet">
                <h3>???</h3>
            </div>
            <div class="card locked">
                <h2>#5</h2>
                <img src="./images/unknown.svg" alt="Not caught yet">
                <h3>???</h3>
            </div>
            <div class="card locked">
                <h2>#6</h2>
                <img src="./images/unknown.svg" alt="Not caught yet">
                <h3>???</h3>
            </div>
        </section>
        <div>
            <button type="button" class="primary-button" id="backToMap">Back to map</button>
            <button type="button" class="primary-button" id="backToRoom">Back to room</button>
            <button type="button" class="primary-button" id="claimWin" hidden>Claim your victory!</button>
        </div>
    </main>
</body>
</html>
