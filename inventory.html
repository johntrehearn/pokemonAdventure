
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <title>Pokemon World - Inventory</title>
</head>
<body>
    <main class="container">
        <div class="screen-label">Screen 6 - Inventory</div>
        <h1>Inventory</h1>
        <section class="pokemon-grid grid-3">
            <div class="card">
                <h2>#1</h2>
                <img src="./images/balls/pokeBall.png" alt="Poke Ball">
                <h3>Poke Ball</h3>
            </div>
            <div class="card">
                <h2>#2</h2>
                <img src="./images/balls/greatBall.png"
                     alt="Great Ball">
                <h3>Great Ball</h3>
            </div>
            <div class="card">
                <h2>#3</h2>
                <img src="./images/balls/ultraBall.png"
                     alt="Ultra Ball">
                <h3>Ultra Ball</h3>
            </div>
        </section>
        <div class="button-row">
            <button class="primary-button">Back to map</button>
            <button class="primary-button">Back to room</button>
        </div>

    </main>
</body>
</html>
