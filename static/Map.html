<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Pokemon Town</title>
  </head>

  <body>
    <div class="container">
      <h1>Where would you like to go?</h1>
      <div class="pokemon-grid grid-3 map-grid">

        <div class="card" id="altcave">
          <h2>#1</h2>
          <img src="images/rooms/AlteringCave.png" alt="Altering Cave" />
          <h3>Altering Cave</h3>
          <div>
            <p>A mysterious cave near the sea.</p>
          </div>
        </div>

        <div class="card" id="paltown">
          <h2>#2</h2>
          <img src="images/rooms/PalletTown.png" alt="Pallet Town" />
          <h3>Pallet Town</h3>
          <div>
            <p>A small town with a big adventure ahead.</p>
          </div>
        </div>

        <div class="card" id="viriforest">
          <h2>#3</h2>
          <img src="images/rooms/ViridianForest.png" alt="Viridian Forest" />
          <h3>Viridian Forest</h3>
          <div>
            <p>A deep forest filled with wild Pokemon.</p>
          </div>
        </div>
      </div>

      <div class="button-row">
        <a href="dictionary.html" target="_parent">
          <button class="primary-button" id="1">Pokedex</button>
        </a>
        <a href="progress.html" target="_parent">
          <button class="primary-button" id="2">Inventory</button>
        </a>
        <button class="primary-button" id="3">Save</button>
        <button class="primary-button" id="5">Quit</button>
      </div>
    </div>
  </body>
</html>
